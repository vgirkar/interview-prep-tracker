<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview prep tracker</title>
<meta name="description" content="A 14-week interview prep tracker: DSA, system design, LLD and machine coding, behavioural, applications and AI rounds.">
<meta name="theme-color" content="#F3F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F1A" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('prep-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234F46E5%27/%3E%3Cstop offset=%271%27 stop-color=%27%23C026D3%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M18 33l10 10 18-20%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%277%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#today">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span><b>Interview prep</b><small>5 December to 12 March</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <div class="dayprog" id="dayprog"></div>
      <div data-account hidden></div>
      <div class="status" data-sync role="status">Connecting</div>
      <div class="side-actions">
        <button type="button" class="ibtn" data-search aria-label="Search and commands" title="Search and commands (Ctrl or Cmd K)"></button>
        <button type="button" class="ibtn" data-theme-btn title="Switch theme"></button>
        <button type="button" class="ibtn" data-settings aria-label="Settings" title="Settings, backup and reset"></button>
      </div>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#today">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span><b>Interview prep</b><small>5 Dec to 12 Mar</small></span>
      </a>
      <div data-account hidden></div>
      <div class="status" data-sync role="status">Connecting</div>
      <button type="button" class="ibtn" data-search aria-label="Search and commands"></button>
      <button type="button" class="ibtn" data-theme-btn title="Switch theme"></button>
      <button type="button" class="ibtn" data-settings aria-label="Settings"></button>
    </header>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <main class="main" id="view"></main>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<div class="ftimer" id="ftimer" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="firebase-config.js"></script>
<script src="plan.js"></script>
<script src="questions.js"></script>
<script>if(location.protocol!=="file:"){var cs=document.createElement("script");cs.type="module";cs.src="cloud.js";document.body.appendChild(cs);}</script>
<script src="app.js"></script>
</body>
</html>
